openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tokens
    description: Pump.fun Supported Pair Assets catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tokens/supported-pairs:
    get:
      operationId: searchSupportedPairAssets
      tags: [tokens]
      summary: Search Pump.fun Supported Pair Assets
      description: Searches a server-side snapshot of the official Pump.fun Supported Pair Assets page by name, ticker, or Solana mint address. Membership in the published catalog does not confirm current launch compatibility.
      parameters:
        - name: query
          in: query
          required: false
          description: Supported pair asset name, ticker, or mint address.
          schema:
            type: string
            minLength: 0
            maxLength: 120
      responses:
        "200":
          description: Matching records from the official-page catalog snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedPairAssetSearchResponse"
        "400":
          description: Invalid search query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The local supported-pair catalog is unavailable or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PairAssetCategory:
      type: string
      enum:
        - native
        - stablecoin
        - tokenized-stock
        - tokenized-asset
        - wrapped
        - protocol
        - platform
        - community
        - memecoin
        - pumpfun-coin
        - other
    SupportedPairAsset:
      type: object
      properties:
        mintAddress:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        ticker:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/PairAssetCategory"
        iconUrl:
          type: ["string", "null"]
          format: uri
        catalogStatus:
          type: string
          enum: [listed]
        compatibilityStatus:
          type: string
          enum: [not-checked]
      required:
        - mintAddress
        - name
        - ticker
        - category
        - iconUrl
        - catalogStatus
        - compatibilityStatus
    SupportedPairAssetSearchResponse:
      type: object
      properties:
        sourceUrl:
          type: string
          format: uri
        sourceLastUpdated:
          type: string
        snapshotCapturedAt:
          type: string
          format: date
        totalAssets:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/SupportedPairAsset"
      required:
        - sourceUrl
        - sourceLastUpdated
        - snapshotCapturedAt
        - totalAssets
        - results
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

