name: Launchpad escrow integration tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "onchain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/launchpad-escrow-tests.yml"
  push:
    paths:
      - "onchain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/launchpad-escrow-tests.yml"

permissions:
  contents: read

concurrency:
  group: launchpad-escrow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-validator:
    name: Local validator on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ESCROW_SOLANA_BIN: ${{ github.workspace }}/.local/share/solana/install/active_release/bin
      ESCROW_CARGO_HOME: ${{ github.workspace }}/.local/share/launchpad-tools/rustup-cargo
      ESCROW_RUSTUP_HOME: ${{ github.workspace }}/.local/share/launchpad-tools/rustup
      CARGO_HOME: ${{ github.workspace }}/.local/share/launchpad-tools/rustup-cargo
      RUSTUP_HOME: ${{ github.workspace }}/.local/share/launchpad-tools/rustup
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Check io_uring before build or validator startup
        run: python3 onchain/test-client/check-io-uring.py

      - name: Install pinned Agave 3.1.10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.local/share"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://release.anza.xyz/v3.1.10/install \
            -o /tmp/agave-v3.1.10-install.sh
          sh /tmp/agave-v3.1.10-install.sh v3.1.10 \
            --no-modify-path \
            --data-dir "$GITHUB_WORKSPACE/.local/share/solana/install"
          echo "$ESCROW_SOLANA_BIN" >> "$GITHUB_PATH"

          test "$("$ESCROW_SOLANA_BIN/solana" --version | awk '{print $2}')" = "3.1.10"
          test "$("$ESCROW_SOLANA_BIN/solana-test-validator" --version | awk '{print $2}')" = "3.1.10"
          builder_version="$("$ESCROW_SOLANA_BIN/cargo-build-sbf" --version)"
          printf '%s\n' "$builder_version"
          grep -Fxq "solana-cargo-build-sbf 3.1.10" <<< "$builder_version"
          grep -Fxq "platform-tools v1.52" <<< "$builder_version"

      - name: Install Rustup in the ignored workspace tool directory
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://sh.rustup.rs \
            -o /tmp/rustup-install.sh
          sh /tmp/rustup-install.sh -y --no-modify-path --default-toolchain 1.89.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" toolchain install 1.89.0 --profile minimal
          "$CARGO_HOME/bin/rustup" default 1.89.0
          "$CARGO_HOME/bin/rustup" --version

      - name: Verify pinned Anchor and Pyth dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'anchor-lang = "=1.0.2"' onchain/programs/launchpad-escrow/Cargo.toml
          grep -Fx 'pyth-solana-receiver-sdk = "=2.0.0"' onchain/programs/launchpad-escrow/Cargo.toml
          grep -F '"@solana/web3.js": "1.98.4"' onchain/test-client/package.json

      - name: Install JavaScript dependencies from the lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@10.26.1 --activate
          test "$(pnpm --version)" = "10.26.1"
          pnpm install --frozen-lockfile

      - name: Verify active Rust 1.89.0 before SBF build
        shell: bash
        run: |
          set -euo pipefail
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          active_toolchain="$(rustup show active-toolchain)"
          printf '%s\n' "$rustc_version" "$cargo_version" "$active_toolchain"
          grep -q '^rustc 1\.89\.0 ' <<< "$rustc_version"
          grep -q '^cargo 1\.89\.0 ' <<< "$cargo_version"
          grep -q '^1\.89\.0\([ -]\|$\)' <<< "$active_toolchain"

      - name: Run local escrow integration tests
        env:
          ESCROW_ALWAYS_BUILD: "1"
        run: pnpm --filter @workspace/launchpad-escrow-tests test

      - name: Verify the SBF Rust compiler version
        shell: bash
        run: |
          set -euo pipefail
          compiler_version="$(rustc +solana --version)"
          printf '%s\n' "$compiler_version"
          grep -q '^rustc 1\.89\.0 ' <<< "$compiler_version"
