[package]
name = "launchpad-escrow"
version = "0.1.0"
description = "Devnet-only fixed-$10 contribution escrow with Pyth SOL/USD validation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
pyth-solana-receiver-sdk = "=2.0.0"

