[package]
name = "launchpad-escrow"
version = "0.1.0"
description = "Devnet-only fixed-$10 contribution escrow with Pyth SOL/USD validation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
pyth-solana-receiver-sdk = "=2.0.0"

[dev-dependencies]
serde_json = "1.0.145"
sha2 = "=0.10.9"
solana-account = "=3.2.0"
solana-clock = "=3.2.1"
solana-instruction = "=3.0.0"
solana-keypair = "=3.0.1"
solana-program-test = { version = "=3.1.10", features = ["agave-unstable-api"] }
solana-pubkey = "=3.0.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

